[project]
name = "humanoid-companion-backend"
version = "0.1.0"
description = "Local-first AI backend for Humanoid Companion: chat, providers, history, robot adapter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0.30", "alembic>=1.13",
  "pydantic>=2.7", "httpx>=0.27", "keyring>=25",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
